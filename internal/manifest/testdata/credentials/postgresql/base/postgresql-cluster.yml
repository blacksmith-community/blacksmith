instance_groups:
    - azs:
        - z1
        - z2
      instances: 3
      jobs:
        - consumes:
            db:
                from: postgres
          name: postgres
          properties:
            pgpool:
                users:
                    - admin: true
                      password: "yes"
                      username: "y"
            postgres:
                config:
                    listen_addresses: 0.0.0.0
                    port: 6432
                hba:
                    - host all all 0.0.0.0/0 md5
                    - host all all ::/0 md5
                replication:
                    enabled: true
          provides:
            db:
                as: postgres
          release: postgres
        - consumes:
            db:
                from: postgres
          name: pgpool
          properties:
            pcp:
                system_password: secret
            pgpool:
                backend:
                    port: 6432
                config:
                    enable_pool_hba: true
                    port: 5432
                hba:
                    - host all all 0.0.0.0/0 md5
                    - host all all ::/0 md5
                users:
                    - admin: true
                      password: "yes"
                      username: "y"
          release: postgres
      name: postgresql
      networks:
        - name: postgresql-service
      persistent_disk_type: default
      stemcell: default
      vm_type: default
