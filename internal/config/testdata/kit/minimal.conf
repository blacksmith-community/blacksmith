web-root: /var/vcap/packages/blacksmith/ui
env:      
shareable: false



broker:
  username: "blacksmith"
  password: "blacksmith"
  port: 3000
  bind_ip: 0.0.0.0

vault:
  address: http://127.0.0.1:8200
  credentials: /var/vcap/store/blacksmith/.vault/creds

bosh:
  address: "https://10.0.0.6:25555"
  username: "admin"
  password: "admin"
  cacert: "-----BEGIN CERTIFICATE-----\nFIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE\n-----END CERTIFICATE-----\n"
  allow_http: false
  request_timeout: 60
  
  stemcells: []
  releases: []


forges:
  auto-scan: true
  scan-paths:
    - "/var/vcap/jobs"            # BOSH job templates location
    - "/var/vcap/data/blacksmith" # BOSH persistent data location
  scan-patterns:
    - "*-forge/templates"         # BOSH template forge pattern
    - "*-forge"                   # BOSH data forge pattern

