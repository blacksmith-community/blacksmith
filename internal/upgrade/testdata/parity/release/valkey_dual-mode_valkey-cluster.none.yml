director_uuid: 00000000-0000-4000-8000-000000000000
features:
  use_dns_addresses: true
instance_groups:
- azs:
  - z1
  instances: 6
  jobs:
  - name: bpm
    release: bpm
  - custom_provider_definitions:
    - name: valkey-san
      type: address
    - name: valkey-alias-domain
      type: placeholder
    name: cluster
    properties:
      auth:
        password: "yes"
      client:
        connections: 10000
        tcpkeepalive: 300
        timeout: 0
      cluster:
        masters: 3
        replicas: 1
      lua:
        scripting-enabled: true
      valkey:
        auto-aof-rewrite-min-size: 64mb
        auto-aof-rewrite-percentage: 100
        maxmemory: 0
        maxmemory-policy: allkeys-lru
        no-appendfsync-on-rewrite: false
        notify-keyspace-events: ""
        slowlog-log-slower-than: 10000
        slowlog-max-len: 128
        tls:
          ca: |
            -----BEGIN CERTIFICATE-----
            FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
            -----END CERTIFICATE-----
          ca_cert: ((valkey_cluster_crt.certificate))
          ca_key: ((valkey_cluster_crt.private_key))
          dual-mode: true
          enabled: true
        version: 8
    provides:
      valkey-alias-domain:
        aliases:
        - domain: _.valkey_cluster.bosh
          placeholder_type: uuid
      valkey-san:
        as: valkey-san
        ip_addresses: false
    release: valkey-forge
  name: node
  networks:
  - name: valkey-service
  stemcell: default
  vm_type: default
meta:
  azs:
  - z1
  bosh_env: fixture-env
  default:
    azs:
    - z1
    - z2
  disk_config: {}
  environment: fixture-env
  instances: 6
  masters: 3
  net: valkey-service
  params:
    instance_id: parity-valkey-dual-mode
  password: "yes"
  replicas: 1
  size: default
  valkey:
    tls:
      ca: |
        #!/usr/bin/env ruby

        -----BEGIN CERTIFICATE-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
        -----END CERTIFICATE-----
      ca_cert: |
        #!/usr/bin/env ruby

        -----BEGIN CERTIFICATE-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
        -----END CERTIFICATE-----
      ca_key: |
        #!/usr/bin/env ruby

        -----BEGIN PRIVATE KEY-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-KEY
        -----END PRIVATE KEY-----
      dual-mode: true
      enabled: true
  valkey_version: 8
name: valkey-cluster-parity-valkey-dual-mode
releases:
- name: valkey-forge
  version: 99.1.0
- name: bpm
  version: 99.0.1
stemcells:
- alias: default
  os: ubuntu-noble
  version: latest
update:
  canaries: 1
  canary_watch_time: 1000-30000
  max_in_flight: 10
  update_watch_time: 1000-30000
variables:
- consumes:
    alternative_name:
      from: valkey-san
      properties:
        wildcard: true
  name: valkey_cluster_crt
  options:
    ca: /fixture-env-bosh/fixture-env-blacksmith/blacksmith_services_ca
    common_name: fixture-env-valkey-cluster.bosh
  type: certificate
