---
credentials:
  host:  (( grab params.hostname ))
  hosts: (( grab jobs.node.ips ))
  port: 0
  password: (( grab meta.password ))
  admin_password: (( grab meta.password ))
  username: default
  service_type: valkey
  tls_port: 6379
  tls_versions: ["tlsv1.2","tlsv1.3"]
  ca_certificate: (( grab instance_groups.node.jobs.cluster.properties.valkey.tls.ca ))
