---
release: postgresql-forge 0.4.0
variant: base
properties:
  service:
    id: postgresql
    name: postgresql
    description: A dedicated PostgreSQL instance, deployed on-demand
    tags:
    - blacksmith
    - dedicated
    - postgresql
    limit: 0
  plans:
    standalone:
      name: standalone
      description: A dedicated PostgreSQL server, with no redundancy or replication
      limit: 7
      type: standalone
      vm_type: default
    cluster:
      name: cluster
      description: A 3-node PostgreSQL replicated cluster, with PGPoolII front-end
      limit: 4
      type: cluster
      vm_type: default
