---
release: rabbitmq-forge 1.5.1
variant: tls
properties:
  environment: fixture-env
  bosh_env: fixture-env
  stemcell_os: ubuntu-noble
  stemcell_version: latest
  plugins: []
  cf:
    nats_tls_only: true
  service:
    id: rabbitmq
    name: rabbitmq
    description: A dedicated RabbitMQ instance, deployed on-demand
    tags:
    - blacksmith
    - dedicated
    - rabbitmq
    limit: 0
    stemcell: latest
  plans:
    standalone:
      name: standalone
      description: A dedicated RabbitMQ server, with no redundancy or replication
      limit: 7
      type: standalone
      vm_type: default
  rabbitmq:
    tls:
      enabled: true
      ca: |
        -----BEGIN CERTIFICATE-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
        -----END CERTIFICATE-----
      crt: |
        -----BEGIN CERTIFICATE-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
        -----END CERTIFICATE-----
      key: |
        -----BEGIN PRIVATE KEY-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-KEY
        -----END PRIVATE KEY-----
