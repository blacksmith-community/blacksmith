---
release: rabbitmq-forge 1.5.1
variant: rabbitmq-autoscale
properties:
  environment: fixture-env
  bosh_env: fixture-env
  stemcell_os: ubuntu-noble
  stemcell_version: latest
  plugins: []
  cf:
    nats_tls_only: true
    exodus_path: secret/exodus/fixture-env/cf
    deployment_name: fixture-env-cf
    system_domain: sys.fixture.example
    api_url: https://api.sys.fixture.example
    username: fixture-admin
    password: fixture-password-not-real
  service:
    id: rabbitmq
    name: rabbitmq
    description: A dedicated RabbitMQ instance, deployed on-demand
    tags:
    - blacksmith
    - dedicated
    - rabbitmq
    limit: 0
    stemcell: latest
  plans:
    standalone:
      name: standalone
      description: A dedicated RabbitMQ server, with no redundancy or replication
      limit: 7
      type: standalone
      vm_type: default
  rabbitmq:
    autoscale:
      enabled: true
  loggregator:
    tls:
      ca_cert: |
        -----BEGIN CERTIFICATE-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
        -----END CERTIFICATE-----
      agent:
        cert: |
          -----BEGIN CERTIFICATE-----
          FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
          -----END CERTIFICATE-----
        key: |
          -----BEGIN PRIVATE KEY-----
          FIXTURE-PLACEHOLDER-NOT-A-REAL-KEY
          -----END PRIVATE KEY-----
  syslog_agent_api:
    tls:
      ca_cert: |
        -----BEGIN CERTIFICATE-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
        -----END CERTIFICATE-----
      cert: |
        -----BEGIN CERTIFICATE-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
        -----END CERTIFICATE-----
      key: |
        -----BEGIN PRIVATE KEY-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-KEY
        -----END PRIVATE KEY-----
  syslog_agent_metrics:
    tls:
      ca_cert: |
        -----BEGIN CERTIFICATE-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
        -----END CERTIFICATE-----
      cert: |
        -----BEGIN CERTIFICATE-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
        -----END CERTIFICATE-----
      key: |
        -----BEGIN PRIVATE KEY-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-KEY
        -----END PRIVATE KEY-----
  forwarder_agent_metrics:
    tls:
      ca_cert: |
        -----BEGIN CERTIFICATE-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
        -----END CERTIFICATE-----
      cert: |
        -----BEGIN CERTIFICATE-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-CERTIFICATE
        -----END CERTIFICATE-----
      key: |
        -----BEGIN PRIVATE KEY-----
        FIXTURE-PLACEHOLDER-NOT-A-REAL-KEY
        -----END PRIVATE KEY-----
  rabbitmq_metrics_emitter:
    cloud_foundry:
      api: https://api.sys.fixture.example
      skip_ssl_validation: false
      username: fixture-admin
      password: fixture-password-not-real
    rmq_management:
      skip_ssl_validation: true
      mgmt_port: '15671'
      mgmt_scheme: https
      mgmt_host: localhost
